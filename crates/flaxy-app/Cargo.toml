[package]
name = "flaxy-app"
version.workspace = true
edition.workspace = true
description = "FLAXY: editor de vídeos em massa (app nativo)"

[[bin]]
name = "FLAXY"
path = "src/main.rs"

[dependencies]
flaxy-core = { path = "../flaxy-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links"] }
rfd = { version = "0.18", default-features = false }
zip = { version = "2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", features = ["json"] }
arboard = { version = "3", default-features = false }
rodio = { version = "0.20", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
